id = "ry.luvus-ports"
name = "Ports"
version = "0.1.0"
min_luvus_version = "0.8.3"
description = "Clickable open-port links per workspace, shown in the Workspaces sidebar. System ports are filtered out."
platforms = ["macos", "linux"]

[[docks]]
id = "ry:ports"
title = "PORTS"
placement = "sidebar.left"

[[startup]]
command = ["sh", "scripts/poll.sh"]

[[settings]]
key = "interval"
title = "Poll interval (seconds)"
type = "number"
default = 5
min = 2
max = 300
step = 1

[[settings]]
key = "max_ports"
title = "Max ports shown"
type = "number"
default = 30
min = 5
max = 100
step = 5

# Repaint promptly when the workspace set changes; the poller covers ports
# starting and stopping in between.
[[events]]
on = "workspace.created"
command = ["python3", "scripts/scan.py"]

[[events]]
on = "tab.created"
command = ["python3", "scripts/scan.py"]

[[actions]]
id = "refresh"
title = "Rescan ports now"
command = ["python3", "scripts/scan.py"]

[[actions]]
id = "open"
title = "Open port in browser"
command = ["sh", "scripts/open.sh"]

[[actions]]
id = "open-workspace-port"
title = "Open project port"
contexts = ["workspace"]
command = ["sh", "scripts/open-workspace-port.sh"]
