id = "ry.p-luvus"
name = "Ports"
version = "0.1.0"
min_luvus_version = "0.8.3"
description = "Clickable open-port links per workspace in a sidebar dock, like Zentty's port badge."
platforms = ["macos", "linux"]

[[docks]]
id = "ry:ports"
title = "Ports"
placement = "sidebar.right"

[[startup]]
command = ["sh", "scripts/poll.sh"]

[[settings]]
key = "interval"
title = "Poll interval (seconds)"
type = "number"
default = 5
min = 2
max = 300
step = 1

[[settings]]
key = "max_ports"
title = "Max ports shown"
type = "number"
default = 30
min = 5
max = 100
step = 5

[[actions]]
id = "refresh"
title = "Rescan ports now"
command = ["python3", "scripts/scan.py"]

[[actions]]
id = "open"
title = "Open port in browser"
command = ["sh", "scripts/open.sh"]
